# #1408 — merge-triggered headless release-check (CLI-lane).
# Fires on a release batch landing on main. Waits for the REAL deploy (Pages build
# bound to this commit + live CDN serving the committed data-build marker), runs the
# saved page-level test plans via the CLI, posts a verdict comment on the merge commit,
# and gates the job on the CLI exit code.
name: Release-check (CLI-lane)
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
permissions:
  contents: write # commit comments
  pages: read
jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for real deploy (build-binding)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE: https://l3x1p.github.io/agentiqa-qa-sandbox-site
        run: |
          set -e
          EXPECTED=$(grep -o 'data-build="[^"]*"' pricing.html | head -1 | sed 's/.*="//;s/"$//')
          echo "committed marker: '$EXPECTED' | sha: $GITHUB_SHA"
          start=$(date +%s)
          # 1) GitHub Pages has built THIS commit
          for i in $(seq 1 60); do
            st=$(gh api repos/${{ github.repository }}/pages/builds/latest -q .status 2>/dev/null || echo '?')
            cm=$(gh api repos/${{ github.repository }}/pages/builds/latest -q .commit 2>/dev/null || echo '?')
            if [ "$st" = "built" ] && [ "$cm" = "$GITHUB_SHA" ]; then echo "pages built for $cm"; break; fi
            sleep 10
          done
          # 2) live CDN (bare URL, as the agent sees it) serves the committed marker
          live=""
          for i in $(seq 1 60); do
            live=$(curl -s --compressed "$SITE/pricing.html" | grep -o 'data-build="[^"]*"' | head -1 | sed 's/.*="//;s/"$//')
            if [ "$live" = "$EXPECTED" ]; then break; fi
            sleep 10
          done
          waited=$(( $(date +%s) - start ))
          echo "live marker: '$live' (expected '$EXPECTED') after ${waited}s"
          echo "DEPLOY_WAIT_SECONDS=$waited" >> "$GITHUB_ENV"
          if [ "$live" != "$EXPECTED" ]; then echo "::error::deploy binding failed — live marker never matched"; exit 1; fi

      - name: Install ffmpeg (video artifacts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Run saved test plans (CLI-lane)
        env:
          AGENTIQA_SERVICE_KEY: ${{ secrets.AGENTIQA_SERVICE_KEY }}
          AGENTIQA_API_URL: https://s.agentiqa.com
        run: |
          set +e
          npx -y agentiqa@staging run \
            --engine https://s-engine.agentiqa.com \
            --artifacts-dir agentiqa-artifacts | tee cli-output.txt
          echo "CLI_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Post verdict comment on merge commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUMMARY=$(grep -aE "Running:|Status:|Passed:|Failed:|Summary|Reason" cli-output.txt 2>/dev/null | sed -E 's/sk_[A-Za-z0-9_-]+/sk_****/g' | head -40)
          [ -z "$SUMMARY" ] && SUMMARY="(no CLI summary captured — see artifacts)"
          {
            echo "## Agentiqa release-check — CLI-lane"
            echo ""
            echo "- Deploy wait: **${DEPLOY_WAIT_SECONDS:-?}s**"
            echo "- CLI exit code: **${CLI_EXIT:-?}** (0 = all plans passed, 1 = a plan failed)"
            echo ""
            echo '```'
            echo "$SUMMARY"
            echo '```'
            echo ""
            echo "Full logs + per-plan screenshots/video: workflow run #${{ github.run_number }} artifacts."
          } > comment.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@comment.md

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentiqa-artifacts-${{ github.run_number }}
          path: |
            agentiqa-artifacts
            cli-output.txt
          if-no-files-found: warn

      - name: Gate job on CLI exit code
        run: exit ${CLI_EXIT:-1}
