<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact us — Acme Notes</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-build="v2-faq">
    <nav class="site-nav" aria-label="Primary">
      <span class="brand">Acme Notes</span>
      <a href="./index.html">Home</a>
      <a href="./features.html">Features</a>
      <a href="./pricing.html">Pricing</a>
      <a href="./contact.html">Contact</a>
    </nav>
    <main>
      <h1>Contact us</h1>
      <p>Have a question? Send us a message and we will reply by email.</p>
      <form class="contact-form" id="contact-form" novalidate="false">
        <label>
          Name
          <input type="text" id="name" name="name" required />
        </label>
        <label>
          Email
          <input type="email" id="email" name="email" required />
        </label>
        <label>
          Message
          <textarea
            id="message"
            name="message"
            required
            minlength="10"
          ></textarea>
        </label>
        <button type="submit">Send message</button>
      </form>
      <div id="send-status-container" aria-live="polite"></div>
    </main>
    <script src="./form.js"></script>
  </body>
</html>
